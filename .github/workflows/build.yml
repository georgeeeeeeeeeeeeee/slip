name: Build

# Mac (universal AU + VST3) and Windows (x64 VST3): tests, pluginval at strictness 10, auval,
# packages. Runs on pushes to main, on release tags (v*) and by hand. A tag also collects both
# packages into a draft GitHub release, checked and published by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The JUCE commit Slip is developed against (~/JUCE on George's Mac, November 2026).
  JUCE_SHA: 501c07674e1ad693085a7e7c398f205c2677f5da
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            generator: ''
            pluginval_zip: pluginval_macOS.zip
            pluginval: pluginval/pluginval.app/Contents/MacOS/pluginval
            platform: mac
          - name: Windows (x64)
            os: windows-latest
            generator: -A x64
            pluginval_zip: pluginval_Windows.zip
            pluginval: pluginval/pluginval.exe
            platform: windows

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_SHA }}
          path: JUCE

      - name: Read version
        run: |
          VERSION=$(tr -d '\r' < CMakeLists.txt | sed -nE 's/^project\(Slip VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$VERSION" ]; then echo "::error::Couldn't read the version from CMakeLists.txt"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match CMakeLists.txt version $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S . -B build ${{ matrix.generator }} -DSLIP_JUCE_PATH="$PWD/JUCE" -DCMAKE_BUILD_TYPE=Release
          TARGETS="Slip_VST3 SlipTests"
          if [ "$RUNNER_OS" = "macOS" ]; then TARGETS="$TARGETS Slip_AU"; fi
          cmake --build build --config Release --parallel --target $TARGETS

      - name: Tests
        run: |
          T=$(find build/SlipTests_artefacts -type f \( -name SlipTests -o -name SlipTests.exe \) | head -1)
          "$T"

      - name: Check universal binaries and sign (macOS)
        if: runner.os == 'macOS'
        run: |
          for b in AU/Slip.component VST3/Slip.vst3; do
            bundle="build/Slip_artefacts/Release/$b"
            bin=$(find "$bundle/Contents/MacOS" -type f -maxdepth 1 | head -1)
            lipo "$bin" -verify_arch arm64 x86_64
            codesign --force --deep --sign - "$bundle"
          done

      - name: Download pluginval
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/${{ matrix.pluginval_zip }}"
          mkdir pluginval && cd pluginval && cmake -E tar xf ../pluginval.zip

      - name: pluginval VST3 (strictness 10)
        run: |
          "${{ matrix.pluginval }}" --strictness-level 10 --validate-in-process --skip-gui-tests \
              --timeout-ms 900000 --validate "build/Slip_artefacts/Release/VST3/Slip.vst3"

      - name: auval (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Slip_artefacts/Release/AU/Slip.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumf Slip Lvrs

      - name: Package
        run: |
          NAME="Slip-$VERSION-${{ matrix.platform }}"
          STAGE="dist/$NAME"
          mkdir -p "$STAGE"
          ART=build/Slip_artefacts/Release
          tr -d '\r' < packaging/README.txt | sed -e "s/@VERSION@/$VERSION/g" -e "s|@SOURCE_URL@|https://github.com/$GITHUB_REPOSITORY/tree/v$VERSION|g" > "$STAGE/README.txt"
          tr -d '\r' < LICENSE > "$STAGE/LICENSE.txt"
          if [ "$RUNNER_OS" = "macOS" ]; then
              ditto "$ART/AU/Slip.component" "$STAGE/Slip.component"
              ditto "$ART/VST3/Slip.vst3" "$STAGE/Slip.vst3"
              ditto -c -k --keepParent "$STAGE" "dist/$NAME.zip"
          else
              for f in README.txt LICENSE.txt; do sed -i 's/$/\r/' "$STAGE/$f"; done
              cp -R "$ART/VST3/Slip.vst3" "$STAGE/"
              (cd dist && cmake -E tar cf "$NAME.zip" --format=zip "$NAME")
          fi
          echo "PACKAGE=dist/$NAME.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE }}
          archive: false
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: Slip-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Checksums
        run: |
          cd dist
          ls -la
          test "$(ls Slip-*.zip | wc -l)" -eq 2
          sha256sum Slip-*.zip > SHA256SUMS.txt

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "Download the zip for your computer below. Each has the plug-in, an install guide (\`README.txt\`) and the licence."
            echo
            echo "- **macOS** 11 or later, Apple silicon and Intel (AU + VST3): \`Slip-$VERSION-mac.zip\`"
            echo "- **Windows** 64-bit (VST3): \`Slip-$VERSION-windows.zip\`"
            echo
            echo "**macOS:** the plug-in isn't notarised by Apple (it has an ad-hoc signature), so macOS blocks it the first time. The install guide explains the one-time step."
            echo
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/Slip-*.zip dist/SHA256SUMS.txt --clobber
          else
              gh release create "$GITHUB_REF_NAME" dist/Slip-*.zip dist/SHA256SUMS.txt \
                  --draft --verify-tag --title "Slip ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
